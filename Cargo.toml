[package]
name = "assess"
version = "0.3.0"
edition = "2024"
license = "MIT"
authors = ["CMD+RVL <engineering@cmdrvl.com>"]
description = "Deterministic decision classification over a spine evidence bundle"
repository = "https://github.com/cmdrvl/assess"
readme = "README.md"
keywords = ["assess", "policy", "cli", "validation", "decision"]
categories = ["command-line-utilities"]

[[bin]]
name = "assess"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
jsonschema = "0.42"
spine-rules = { git = "https://github.com/cmdrvl/spine-rules", rev = "5ec6622", version = "=0.3.1" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
